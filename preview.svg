  <rect x="271" y="696" width="28" height="28" rx="8" fill="#244030"/><text x="278" y="716" font-size="18" fill="#a1ddbd">✧</text>
  <text x="311" y="715" font-size="13" font-weight="bold" fill="#c2d0d4">Selekcja · klient właśnie nazwał problem</text>
  <rect x="870" y="699" width="165" height="22" rx="11" fill="#15251d" stroke="#33443a"/><text x="952" y="714" text-anchor="middle" font-family="monospace" font-size="9" fill="#a8d9b7" letter-spacing=".5">PRIORYTET WYSOKI</text>
  <path d="M276 755v82" stroke="#658b73" stroke-width="2"/>
  <text x="290" y="762" font-family="monospace" font-size="10" fill="#769080" letter-spacing=".7">KLIENT · TRANSKRYPCJA NA ŻYWO</text>
  <text x="290" y="786" font-size="15" font-style="italic" fill="#adbac0">„Na jedno stanowisko wpada czasem 150 CV, ale sensownych kandydatów</text>
  <text x="290" y="808" font-size="15" font-style="italic" fill="#adbac0">jest może dziesięciu.”</text>
  <path d="M274 855H1031" stroke="#28343d"/>
  <text x="276" y="884" font-family="monospace" font-size="11" fill="#a4dabc" letter-spacing="1">⭐ &#160; ZADAJ TERAZ</text>
  <text x="276" y="921" font-size="22" font-weight="600" fill="#eff3f2">„Jak dużo czasu zajmuje dziś przejrzenie tych wszystkich zgłoszeń?”</text>
  <path d="M278 950h7" stroke="#80b397" stroke-width="2"/><text x="292" y="954" font-size="12" fill="#8998a1">Nie zakładaj skali problemu — pozwól klientowi opisać ją własnymi słowami.</text>
  <path d="M274 977H1031" stroke="#28343d"/>
  <text x="276" y="1007" font-family="monospace" font-size="11" fill="#9caca6" letter-spacing="1">ALTERNATYWA 1</text>
  <text x="276" y="1043" font-size="20" font-weight="500" fill="#e8eeee">„Co dzieje się z pozostałymi CV po zakończeniu rekrutacji?”</text>
  <path d="M278 1070h7" stroke="#80b397" stroke-width="2"/><text x="292" y="1074" font-size="12" fill="#8998a1">Może otworzyć temat ponownego wykorzystania kandydatów.</text>
  <path d="M274 1101H1031" stroke="#28343d"/>
  <text x="276" y="1138" font-size="11" fill="#66747e">✓ &#160; Krótko. Naturalnie. Do użycia od razu.</text><text x="904" y="1138" font-size="11" fill="#9aa8b0">Pokaż kontekst &#160;⌄</text>
  <text x="652" y="1206" text-anchor="middle" font-family="monospace" font-size="10" fill="#64727a" letter-spacing="1">MAKSYMALNIE 3 KARTY · PODPOWIEDZI WIDOCZNE TYLKO DLA CIEBIE</text>
  <!-- Manual prompt -->
  <text x="250" y="1263" font-family="monospace" font-size="10" fill="#61716d" letter-spacing="1">ALBO</text>
  <text x="291" y="1263" font-size="14" fill="#b6c1c5">Potrzebujesz podpowiedzi od razu?</text>
  <rect x="250" y="1280" width="805" height="47" rx="9" fill="#101820" stroke="#2b3740"/>
  <text x="268" y="1309" font-size="13" fill="#63717d">Wpisz hasło lub krótki cytat klienta…</text>
  <rect x="915" y="1285" width="133" height="37" rx="6" fill="#253d31"/><text x="936" y="1308" font-size="12" fill="#b4e5c7">Podpowiedz &#160;→</text>
  <g font-size="11" fill="#98a6ad"><rect x="250" y="1341" width="59" height="27" rx="14" fill="#121b22" stroke="#27323a"/><text x="279" y="1359" text-anchor="middle">Cena</text><rect x="317" y="1341" width="55" height="27" rx="14" fill="#121b22" stroke="#27323a"/><text x="344" y="1359" text-anchor="middle">Test</text><rect x="380" y="1341" width="82" height="27" rx="14" fill="#121b22" stroke="#27323a"/><text x="421" y="1359" text-anchor="middle">Selekcja</text><rect x="470" y="1341" width="86" height="27" rx="14" fill="#121b22" stroke="#27323a"/><text x="513" y="1359" text-anchor="middle">Manager</text><rect x="564" y="1341" width="58" height="27" rx="14" fill="#121b22" stroke="#27323a"/><text x="593" y="1359" text-anchor="middle">RODO</text></g>
  <path d="M50 1401H1150" stroke="#1c2630"/><text x="250" y="1432" font-family="monospace" font-size="10" fill="#a2b3aa" letter-spacing="1">BDM / COACH</text><text x="353" y="1432" font-size="10" fill="#61707a">zbudowany dla lepszych rozmów</text><text x="1000" y="1432" font-size="11" fill="#77858f">ⓘ &#160; Jak to działa</text>
  <rect y="1458" width="1200" height="42" fill="#111a22"/><path d="M0 1458H1200" stroke="#2b3942"/><rect x="412" y="1473" width="15" height="15" rx="3" fill="none" stroke="#9fe0bd"/><path d="M415 1480l4 4 7-8" fill="none" stroke="#9fe0bd" stroke-width="1.5"/><text x="439" y="1486" font-size="12" fill="#a8b5ba">Potwierdzam, że mogę używać transkrypcji z tego spotkania.</text>
