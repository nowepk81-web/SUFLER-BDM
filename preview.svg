  <circle cx="981" cy="47" r="4" fill="#78d5a2"/><text x="992" y="51" font-size="11" fill="#b4e9c9" letter-spacing="1">NA ŻYWO · 08:42</text>
  <rect x="1115" y="31" width="34" height="34" rx="9" fill="#101820" stroke="#26313b"/><text x="1125" y="53" font-size="17" fill="#94a3b0">⚙</text>
  <!-- Hero -->
  <path d="M50 560H1150" stroke="#202a34"/>
  <path d="M443 139h28m258 0h28" stroke="#486450"/>
  <text x="600" y="143" text-anchor="middle" font-family="monospace" font-size="11" fill="#9ab1a4" letter-spacing="2">ASYSTENT SPOTKAŃ B2B</text>
  <text x="600" y="231" text-anchor="middle" font-size="70" font-weight="500" letter-spacing="-3">Jestem na</text>
  <text x="600" y="311" text-anchor="middle" font-family="Georgia,serif" font-size="76" font-style="italic" fill="#9fe0bd" letter-spacing="-3">nasłuchu.</text>
  <text x="600" y="359" text-anchor="middle" font-size="17" fill="#8d9ba6">Analizuję przebieg spotkania. Wróć tu po krótką, konkretną podpowiedź.</text>
  <rect x="432" y="393" width="336" height="53" rx="9" fill="#47292b"/>
  <path d="M461 412v15m7-15v15m7-15v15" stroke="#ffd5d0" stroke-width="3" stroke-linecap="round"/>
  <text x="493" y="426" font-size="15" font-weight="bold" fill="#ffd5d0">Zatrzymaj nasłuchiwanie</text>
  <text x="600" y="480" text-anchor="middle" font-family="monospace" font-size="11" fill="#9fe0bd" letter-spacing="1.5">▂ ▅ ▇ ▄ ▆ ▃ &#160; MIKROFON AKTYWNY · SŁUCHAM SPOTKANIA</text>
  <text x="600" y="514" text-anchor="middle" font-size="12" fill="#697782">✓ Brak nagrania w aplikacji &#160; · &#160; Bez dźwięków i wibracji &#160; · &#160; AI połączone</text>
  <!-- Coach section heading -->
  <text x="250" y="613" font-family="monospace" font-size="11" fill="#829e8e" letter-spacing="1.5">◉ &#160; PODPOWIEDŹ NA TERAZ</text>
